name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup PropFi SDK
        run: |
          git clone https://github.com/propfi-protocol/propfi-sdk.git /tmp/propfi-sdk
          cd /tmp/propfi-sdk
          npm ci --legacy-peer-deps
          npm run build
      - name: Install frontend and link SDK
        run: |
          npm ci --legacy-peer-deps
          rm -rf node_modules/@propfi
          mkdir -p node_modules/@propfi
          ln -s /tmp/propfi-sdk node_modules/@propfi/sdk
      - run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup PropFi SDK
        run: |
          git clone https://github.com/propfi-protocol/propfi-sdk.git /tmp/propfi-sdk
          cd /tmp/propfi-sdk
          npm ci --legacy-peer-deps
          npm run build
      - name: Install frontend and link SDK
        run: |
          npm ci --legacy-peer-deps
          rm -rf node_modules/@propfi
          mkdir -p node_modules/@propfi
          ln -s /tmp/propfi-sdk node_modules/@propfi/sdk
      - run: npm run lint